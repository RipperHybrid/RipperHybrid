name: Refresh Profile
on:
  schedule:
    # Runs at 00:00 every 2 days
    - cron: '0 0 */2 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile.yml'
      - 'exclude.txt'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Update Info
        uses: actions/github-script@v6
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOTAPI }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          github-token: ${{ secrets.PROFILE_PAT }}
          retries: 3
          script: |
            const fs = require('fs');
            const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
            const CHAT_ID   = process.env.TELEGRAM_CHAT_ID;
            const OWNER     = context.repo.owner;
            const SELF_REPO = context.repo.repo;

            const now   = new Date();
            const since = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();

            const safeBadgeText = (str) =>
              encodeURIComponent(str.replace(/-/g, '--').replace(/_/g, '__').trim()).replace(/%20/g, '%20');

            let excludedRepos = [];
            if (fs.existsSync('exclude.txt')) {
              excludedRepos = fs.readFileSync('exclude.txt', 'utf8')
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            }

            let res = {};
            try {
              const tgRes  = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChat?chat_id=${CHAT_ID}`);
              const tgData = await tgRes.json();
              res = tgData.result || {};
            } catch (e) {
              console.log('Telegram fetch failed, continuing without it:', e.message);
            }

            const displayName = res?.title ||
                                (res?.first_name ? `${res.first_name}${res.last_name ? ' ' + res.last_name : ''}` : null) ||
                                res?.username ||
                                OWNER;

            const channelLink = res?.username ? `https://t.me/${res.username}` : `https://t.me/Ripper_Hybrid`;

            let audioInfo = '';
            if (res?.first_profile_audio) {
              const audio = res.first_profile_audio;
              const title = audio.title || '';
              const performer = audio.performer || '';
              const clean = (audio.file_name || '').replace(/\s+/g, ' ').trim().replace(/\.m4a$/, '');
              audioInfo = (title && performer) ? `${title} by ${performer}` : clean;
              if (audioInfo.length > 60) audioInfo = audioInfo.substring(0, 57) + '...';
            }

            const allRepos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
              visibility: 'all',
              affiliation: 'owner',
              sort: 'pushed',
              direction: 'desc',
              per_page: 100
            });

            const includesPrivate = allRepos.some(r => r.private);

            const activeRepos = allRepos.filter(r =>
              r.name !== SELF_REPO && !excludedRepos.includes(r.name) &&
              r.pushed_at && new Date(r.pushed_at) >= new Date(since)
            );

            // Fetch language breakdown per repo in parallel, tolerating individual failures
            const repoResults = await Promise.allSettled(
              activeRepos.slice(0, 6).map(async (repo) => {
                const langRes = await github.rest.repos.listLanguages({ owner: OWNER, repo: repo.name });
                return { name: repo.name, languages: langRes.data || {} };
              })
            );

            const repoDetails = repoResults
              .filter(r => r.status === 'fulfilled')
              .map(r => r.value);

            // Aggregate language bytes across active repos for a Top Languages section
            const langTotals = {};
            for (const repo of repoDetails) {
              for (const [lang, bytes] of Object.entries(repo.languages)) {
                langTotals[lang] = (langTotals[lang] || 0) + bytes;
              }
            }
            const totalBytes = Object.values(langTotals).reduce((a, b) => a + b, 0);
            const topLanguages = Object.entries(langTotals)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 6)
              .map(([lang, bytes]) => ({ lang, pct: totalBytes > 0 ? (bytes / totalBytes) * 100 : 0 }));

            const monthLabel = now.toLocaleString('en-US', { month: 'long' });
            const c = [];

            c.push(`<div align="center">`);
            c.push(`  <h1>👋 ${displayName}</h1>`);
            c.push(`  <p><i>Automatically updated activity report for <b>${monthLabel} ${now.getFullYear()}</b></i></p>`);
            c.push(`</div>\n`);

            c.push(`---\n\n### 🧬 Top Languages This Month\n`);
            if (includesPrivate) {
              c.push(`<sub>🔒 includes private repositories</sub>\n`);
            }
            if (topLanguages.length > 0) {
              for (const { lang, pct } of topLanguages) {
                const filled = Math.round(pct / 5);
                const bar = '█'.repeat(filled) + '░'.repeat(20 - filled);
                c.push(`\`${lang.padEnd(12)}\` ${bar} ${pct.toFixed(1)}%  `);
              }
            } else {
              c.push(`> 🌿 No language data available for this month.`);
            }

            c.push(`\n---\n\n<div align="center">`);

            const imgStyle = 'style="height: 20px !important; width: auto !important; margin-bottom: 4px;"';
            const sp = '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;';
            const bottomBadges = [];

            bottomBadges.push(`<a href="${channelLink}"><img src="https://img.shields.io/badge/Telegram-${safeBadgeText(displayName)}-26A69A?style=plastic&logo=telegram&logoColor=white" ${imgStyle}/></a>`);
            bottomBadges.push(`<a href="https://github.com/${OWNER}/${SELF_REPO}/actions/workflows/profile.yml"><img src="https://github.com/${OWNER}/${SELF_REPO}/actions/workflows/profile.yml/badge.svg?style=plastic" ${imgStyle}/></a>`);
            if (audioInfo) {
              bottomBadges.push(`<img src="https://img.shields.io/badge/Vibe-${safeBadgeText(audioInfo)}-1DB954?style=plastic&logo=spotify&logoColor=white" ${imgStyle}/>`);
            }

            c.push(bottomBadges.join(sp));
            c.push(`</div>`);

            const finalReadme = c.join('\n');
            console.log("\n--- GENERATED README ---\n" + finalReadme);
            fs.writeFileSync('README.md', finalReadme);

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Git: Update profile info" || exit 0
          git push || exit 0